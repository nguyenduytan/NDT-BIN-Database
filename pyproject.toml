[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ndt-bin-database"
version = "1.0.0"
description = "Normalized BIN/IIN datasets, offline search and reproducible refreshes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Tony Nguyen"}]
dependencies = ["pycountry==24.6.1"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.scripts]
ndt-bin = "ndt_bin.cli:main"

[tool.setuptools.packages.find]
include = ["ndt_bin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

